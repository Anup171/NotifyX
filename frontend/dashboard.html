<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="NotifyX — High-performance real-time notification system and developer dashboard." />
  <meta name="theme-color" content="#0c0c0c" />
  <title>NotifyX — Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <div id="root"></div>

  <script>
    // Smart API URL resolution:
    // 1. Query param ?api=http://... or localStorage 'notifyx_api_override'
    // 2. Localhost / 127.0.0.1 -> http://localhost:3000
    // 3. Deployed production -> https://notifyx-api-fln6.onrender.com
    (function () {
      const urlParams = new URLSearchParams(window.location.search);
      const queryApi = urlParams.get('api');
      const storageApi = localStorage.getItem('notifyx_api_override');
      
      if (queryApi) {
        localStorage.setItem('notifyx_api_override', queryApi);
        window.NOTIFYX_API_URL = queryApi;
      } else if (storageApi) {
        window.NOTIFYX_API_URL = storageApi;
      } else {
        const isLocalhost = window.location.hostname === 'localhost' || 
                            window.location.hostname === '127.0.0.1' || 
                            window.location.hostname === '';
        window.NOTIFYX_API_URL = isLocalhost 
          ? 'http://localhost:3000' 
          : 'https://notifyx-api-fln6.onrender.com';
      }
      console.log('[NotifyX] Using API base URL:', window.NOTIFYX_API_URL);
    })();
  </script>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js"
    integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L"
    crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"
    integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm"
    crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"
    integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y"
    crossorigin="anonymous"></script>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

  <script type="text/babel" src="icons.jsx"></script>
  <script type="text/babel" src="data.jsx"></script>
  <script type="text/babel" src="charts.jsx"></script>
  <script type="text/babel" src="screens.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
</body>

</html>
